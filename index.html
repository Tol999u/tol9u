      { level: "중급", category: "기초", icon: "🚚", ko: "마이그레이션", en: "Migration", def: "기존 시스템과 데이터를 새로운 클라우드 환경으로 옮기는 작업", analogy: "이사" },
      { level: "중급", category: "기초", icon: "🚕", ko: "서버리스", en: "Serverless", def: "서버 관리 없이 코드만 올려서 실행하는 개발 방식", analogy: "자차 없이 '택시 이용'" },
      { level: "중급", category: "기초", icon: "♾️", ko: "DevOps", en: "DevOps", def: "개발(Dev)과 운영(Ops)을 합쳐 더 빠르게 서비스를 배포하는 방식", analogy: "원스톱 스피드 협업팀" },
      { level: "중급", category: "AWS 핵심", icon: "🧭", ko: "Amazon Route 53", en: "Amazon Route 53", def: "AWS의 DNS 서비스로 도메인 연결과 트래픽을 관리", analogy: "AWS 전용 네비게이션" },

      { level: "고급", category: "AI/데이터", icon: "🤖", ko: "에이전틱 AI", en: "Agentic AI", def: "스스로 목표를 세우고 여러 단계를 계획·실행하는 자율 AI", analogy: "스스로 판단해 일하는 자율 비서" },
      { level: "고급", category: "AI/데이터", icon: "📌", ko: "LoRA", en: "Low-Rank Adaptation", def: "전체 모델 대신 일부 매개변수만 가볍게 미세조정하는 기술", analogy: "책 전체를 안 새로 쓰고 포스트잇 메모 추가" },
      { level: "고급", category: "AI/데이터", icon: "🧩", ko: "Tokenization", en: "토큰화", def: "문장을 AI가 처리할 수 있는 최소 단위(토큰)로 쪼개는 작업", analogy: "문장을 레고 블록 조각으로 나누기" },
      { level: "고급", category: "AI/데이터", icon: "🎓", ko: "RLHF", en: "Reinforcement Learning from Human Feedback", def: "사람의 피드백을 반영하여 AI의 답변 품질을 강화 학습", analogy: "칭찬과 교정으로 학생 가르치기" },
      { level: "고급", category: "AI/데이터", icon: "🔗", ko: "LangChain", en: "랭체인", def: "LLM을 외부 DB, API와 연결해 복잡한 AI 앱을 개발하는 프레임워크", analogy: "레고 블록을 연결해 조립품 만들기" },
      { level: "고급", category: "AI/데이터", icon: "🚧", ko: "Guardrails", en: "가드레일", def: "AI가 유해하거나 편향된 답을 내놓지 못하도록 막는 안전장치", analogy: "도로 옆의 안전 펜스" },
      { level: "고급", category: "AI/데이터", icon: "📊", ko: "Vector DB", en: "Vector Database", def: "단어의 '의미적 유사도'를 계산해 비슷한 개념을 고속 검색하는 DB", analogy: "연관 개념 전문 도서관" },
      { level: "고급", category: "AI/데이터", icon: "👑", ko: "Sovereign AI", en: "소버린 AI", def: "외부 종속 없이 한 국가/기업이 통제권을 가진 자체 AI 구축", analogy: "자체 기술 국방 무기 체계" },
      { level: "고급", category: "AI/데이터", icon: "👁️", ko: "Multi-Modal AI", en: "멀티모달 AI", def: "텍스트뿐만 아니라 이미지, 음성, 영상까지 동시에 이해하는 AI", analogy: "시각·청각을 모두 갖춘 사람" },
      { level: "고급", category: "AWS 핵심", icon: "🚢", ko: "AWS Fargate", en: "AWS Fargate", def: "서버 관리 없이 컨테이너를 실행하게 해 주는 서버리스 서비스", analogy: "자동 운항 컨테이너 선박" },
      { level: "고급", category: "AWS 핵심", icon: "📊", ko: "Amazon Redshift", en: "Amazon Redshift", def: "대량의 데이터를 빠르게 분석하는 데이터 웨어하우스", analogy: "초대형 데이터 고속 분석기" },
      { level: "고급", category: "AWS 핵심", icon: "⚡", ko: "Amazon ElastiCache", en: "Amazon ElastiCache", def: "자주 쓰는 데이터를 메모리에 담아 초고속으로 추출하는 캐시", analogy: "자주 쓰는 물건 보관함" },
      { level: "고급", category: "기초", icon: "🏗️", ko: "쿠버네티스", en: "Kubernetes", def: "수많은 컨테이너를 자동으로 배포, 확장, 관리해 주는 도구", analogy: "항구의 자동 관제 크레인" },
      { level: "고급", category: "기초", icon: "⚙️", ko: "CI/CD", en: "Continuous Integration / Delivery", def: "코드 수정을 자동으로 통합·테스트·배포하는 파이프라인", analogy: "자동화된 공장 제품 출하 라인" }
    ];

    let currentList = [...allCards];
    let currentIndex = 0;

    function renderCard() {
      const cardEl = document.getElementById('card');
      cardEl.classList.remove('flipped');
      
      if(currentList.length === 0) {
        document.getElementById('cardCategory').innerText = "없음";
        document.getElementById('cardLevel').innerText = "-";
        document.getElementById('cardLevel').className = "level-badge";
        document.getElementById('cardIcon').innerText = "❓";
        document.getElementById('termKo').innerText = "검색 결과 없음";
        document.getElementById('termEn').innerText = "No Cards Found";
        document.getElementById('defText').innerText = "선택한 조건에 해당하는 용어가 없습니다.";
        document.getElementById('analogyText').innerText = "상단의 다른 필터를 터치해 보세요.";
        document.getElementById('counter').innerText = "0 / 0";
        document.getElementById('progressBar').style.width = "0%";
        return;
      }

      const item = currentList[currentIndex];
      document.getElementById('cardCategory').innerText = item.category;
      
      const levelEl = document.getElementById('cardLevel');
      levelEl.innerText = item.level;
      levelEl.className = `level-badge level-${item.level}`;

      document.getElementById('cardIcon').innerText = item.icon || "☁️";
      document.getElementById('termKo').innerText = item.ko;
      document.getElementById('termEn').innerText = item.en;
      document.getElementById('defText').innerText = item.def;
      document.getElementById('analogyText').innerText = item.analogy;
      
      document.getElementById('counter').innerText = `${currentIndex + 1} / ${currentList.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / currentList.length) * 100}%`;
    }

    function flipCard() {
      if(currentList.length > 0) {
        document.getElementById('card').classList.toggle('flipped');
      }
    }

    function nextCard() {
      if (currentIndex < currentList.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function shuffleCards() {
      currentList.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCard();
    }

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (cat === '전체') {
        currentList = [...allCards];
      } else {
        currentList = allCards.filter(c => c.category === cat);
      }
      currentIndex = 0;
      renderCard();
    }

    function filterLevel(lvl) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      currentList = allCards.filter(c => c.level === lvl);
      currentIndex = 0;
      renderCard();
    }

    renderCard();
  </script>
</body>
</html>
